apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-api
  labels:
    {{- include "chart.labels" . | nindent 4 }}
{{- if .Values.annotations }}
  annotations: {{ toYaml .Values.annotations | nindent 4 }}
{{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.cubeApi.replicas }}
  {{- end }}
  selector:
    matchLabels:
      cubejsApp: cubeApi
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        cubejsApp: cubeApi
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: cubeapi-pv
          emptyDir: {}
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
          - configMapRef:
              name: {{ .Values.cubeApi.configmap.name }}
          - secretRef:
              name: {{ if .Values.db.existingSecret }}{{ .Values.db.existingSecret }}{{ else }}cubejs-db-secret{{ end }}
          - secretRef:
              name: {{ if .Values.extDb.existingSecret }}{{ .Values.extDb.existingSecret }}{{ else }}cubejs-ext-db-secret{{ end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.cubeApi.image }}"
          imagePullPolicy: {{ .Values.cubeApi.pullPolicy }}
          volumeMounts:
            - mountPath: /cube/conf
              name: cubeapi-pv
          ports:
            - name: http
              containerPort: {{ .Values.cubeApi.service.port }}
              protocol: TCP
          {{- if .Values.cubeApi.probes.enabled }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.cubeApi.service.port }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.cubeApi.service.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.cubeApi.service.port }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml (default .Values.resources .Values.cubeApi.resources) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
